<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" type="image/svg+xml" href="public/favicon.ico" />
   <title>Components-page</title>
</head>

<body>
   <div class="components">
      <div class="components__container">

         <div class="components__item">
            <button class="icon-menu">
               <span></span>
            </button>
         </div>

         <div class="components__item">
            <button type="button" class="button button--icon-arrow-bt">Our Catalog</button>
         </div>

         <div class="components__item">
            <article class="item-catalog">
               <div class="item-catalog__image">
                  <img src="/src/assets/img/catalog/popular-img-01.webp" alt="catalog image">
               </div>
               <div class="item-catalog__content">
                  <div class="item-catalog__top">
                     <h3 class="item-catalog__title">Enchanted Petals</h3>
                     <div class="item-catalog__actions actions">
                        <button class="actions__button actions__button--icon-like"></button>
                        <button class="actions__button actions__button--icon-card-icon"></button>
                     </div>
                  </div>
                  <div class="item-catalog__price">70 Euro</div>
               </div>
            </article>
         </div>

         <div class="components__item">

         </div>

         <div class="components__item">

         </div>

      </div>
   </div>

   <script type="module" src="/src/main.js"></script>
</body>

</html>
